name: AetherXWatch
options:
  bundleIdPrefix: io.ilie
  deploymentTarget:
    watchOS: "11.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: 6.2
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    # XcodeGen's preset drops $(inherited), which would hide MATRIX_SDK_SENTRY from SDKBuild.xcconfig.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
packages:
  MatrixRustSDK:
    path: Packages/MatrixRustSDK
  CompoundDesignTokens:
    path: Packages/CompoundDesignTokens
  QRCodeGenerator:
    url: https://github.com/fwcd/swift-qrcode-generator
    exactVersion: 2.0.2
targets:
  AetherXWatch:
    type: application
    platform: watchOS
    sources:
      - AetherXWatch/Sources
      - AetherXWatch/Resources
    dependencies:
      - package: MatrixRustSDK
      - package: CompoundDesignTokens
      - package: QRCodeGenerator
    entitlements:
      path: AetherXWatch/SupportingFiles/AetherXWatch.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.ilie.aetherx.watch
    info:
      path: AetherXWatch/SupportingFiles/Info.plist
      properties:
        CFBundleDisplayName: Aether X
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKWatchOnly: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Share your location in chats.
        NSMicrophoneUsageDescription: Record voice messages in chats.
        UIBackgroundModes: [location]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ilie.aetherx.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-ObjC"]
        # XcodeGen sets no runpath for watch-only apps, so embedded package frameworks fail to load on device.
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
    preBuildScripts:
      - name: Sourcery
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:$PATH"
          if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/AutoMockableConfig.yml
          else
            echo "warning: sourcery not installed"
          fi
  UnitTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - UnitTests/Sources
    dependencies:
      - target: AetherXWatch
      - package: MatrixRustSDK
      - package: CompoundDesignTokens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ilie.aetherx.watch.unittests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AetherXWatch.app/AetherXWatch"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AetherXWatch:
    build:
      targets:
        AetherXWatch: all
        UnitTests: [test]
    test:
      targets: [UnitTests]
      gatherCoverageData: true
